{% extends "base.html" %}

{% block titre %}Connexion — StockFlow{% endblock %}

{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h4 mb-3">Connexion</h1>

        {% if form.errors %}
            <div class="alert alert-danger">Identifiants incorrects.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="{{ form.password.id_for_label }}" class="form-label">Mot de passe</label>
                <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </div>
</div>
{% endblock %}
